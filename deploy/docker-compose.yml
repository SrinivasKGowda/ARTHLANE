name: arthlane

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./arthlane.caddy:/etc/caddy/arthlane.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

  web:
    build: ../market-oracle
    restart: unless-stopped

  api:
    build: ../arthlane-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/arthlane
      DATABASE_USER: arthlane
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ARTHLANE_JWT_SECRET: ${ARTHLANE_JWT_SECRET:?set ARTHLANE_JWT_SECRET in .env}
      ARTHLANE_CORS_ORIGINS: https://${DOMAIN}
      ARTHLANE_MAIL_FROM: ${MAIL_FROM:-Arthlane <no-reply@example.com>}
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: arthlane
      POSTGRES_USER: arthlane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthlane -d arthlane"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caddy-data:
  caddy-config:
  pg-data:
